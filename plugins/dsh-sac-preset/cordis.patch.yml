# Agent preset `sac`: the shipped `standard` composition plus the
# Single-Action Compaction policy (`@local/dsh-sac-compact`) mounted inside the
# same isolated compaction group as `compaction-basic`.
#
# Sessions that select this preset run the SAC policy measured in
# reports/REPORT-SAC-PARETO.md (cost-aware folding, plugin 1.3.0): nothing
# folds on a short dialogue, a long session is folded once the request has
# grown large enough for a fold to pay for itself. Sessions on any other
# preset never load it.
#
# The `sac-compact` config below must stay identical, key for key, to the
# config in ../dsh-sac-compact/cordis.patch.yml (the bundle's shipped policy):
# test/preset-policy.test.js compares the two.
- insert:
    - id: preset-sac
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: sac
        name: SAC 单动作压缩
        description: 请求变大后才折叠：短对话等同全量历史，长会话把已完成的工作折叠成一段语义状态（论文 arXiv:2611.05306；1.3.0 成本感知折叠）。
        order: 10
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              # Set false to drop the apply_patch tool beside edit.
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-agent-preset/package.json')), 'skills')
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
              # Strict SAC: after every completed action the span is folded into
              # one semantic state. It drives the sibling compaction-basic
              # instance through ctx.compaction.compactRegion().
              - id: sac-compact
                name: '@local/dsh-sac-preset/sac'
                inject:
                  - systemPrompt
                  - tools
                  - llm
                config:
                  # Base keys, tuned 2026-11-17 for GLM-5.3-Inner under a 128K
                  # window: paper-mode recap (inline never fires on reasoning
                  # models), keep the newest observation, trim huge
                  # observations only, 400-word recap, lean state-update
                  # request, and a 96K-token hard fold trigger as the window
                  # safety net. When they were written, the plugin also folded
                  # after every 2 actions; since the cost-aware keys at the end
                  # of this block, folding starts from the request size instead.
                  enabled: true
                  actionsPerCompaction: 2
                  minSpanChars: 1200
                  minSpanTokens: 400
                  charsPerToken: 3.5
                  statePrompt: paper
                  stateMaxTokens: 2048
                  stateInputMaxChars: 0
                  stateBudget: 2048
                  adaptiveBudget: true
                  keepLastObservation: true
                  trimObservationOver: 4000
                  stateMaxWords: 400
                  stateInputLean: true
                  contextBudgetTokens: 96000
                  inlineFallbackAfter: 2
                  ledger: false
                  ledgerChars: 2400
                  ledgerFullCommands: true
                  recall: false
                  checklist: false
                  # Multi-turn (1.2.0): every user instruction stays on the
                  # surface verbatim and only the work between instructions is
                  # folded; the 4 most recent requests are kept, older ones are
                  # quoted verbatim in the archive state. These are the defaults.
                  pinInstructions: true
                  instructionSourceKinds:
                    - user
                    - goal
                  maxPinnedInstructions: 4
                  instructionChars: 4000
                  # Cost-aware folding (plugin 1.3.0, the shipped policy; identical
                  # to ../dsh-sac-compact/cordis.patch.yml). Folding pays for itself
                  # only on long sessions: on a ten-step dialogue a model-written
                  # recap costs more than the context it frees, and folding often
                  # makes the agent re-read what was folded
                  # (reports/REPORT-SAC-PARETO.md). Hence:
                  foldTrigger: size
                  # …fold by the size of the whole request, not by action count,
                  foldMarginTokens: 32000
                  # …once it exceeds the fixed prompt (system prompt + tool
                  # schemas) by about 32K tokens, and down to the fixed prompt +
                  # about 16K (foldBelowTokens 0 = half the margin). One setting
                  # then fits a 5K customer-service prompt and a 20K coding-agent
                  # prompt. Lower it to 24000 or 12000 to trade more folds for a
                  # smaller context.
                  foldAboveTokens: 0
                  foldBelowTokens: 0
                  maxFoldsPerStep: 3
                  foldMinGainTokens: 400
                  # …a model recap only replaces a span at least the recap + 400
                  # tokens …
                  recapExpectedTokens: 0
                  recapMaxRatio: 0.6
                  # …and stays under 60% of that span (never "not smaller").
                  mechanicalFoldMaxTokens: 4000
                  mechanicalSegments: frozen
                  mechanicalMinGainTokens: 80
                  # Small digests are written by the harness (no model call), for
                  # finished turns only: digesting the working state after every
                  # step made the agent redo its work.
                  digestResultChars: 2000
                  digestReplyChars: 4000
                  digestMaxChars: 3000
                  digestShrinkToBudget: true
                  # JSON results are compacted by structure, not cut. When a
                  # finished turn holds more results than fit that budget, every
                  # result takes a smaller share (its head) instead of the turn
                  # being handed to the model.
                  replyReasoningFoldChars: 1500
                  # A final reply with heavy reasoning folds with its turn.
                  stateMaxTokensThinking: 4096
                  # A thinking agent's first recap starts from a 4,096 output cap.
                  goalDedupe: true
                  # Optional, not set here: stateProvider / stateModel, a
                  # non-reasoning model that writes the recaps (about 5 s instead
                  # of 20-70 s per fold).
                  stateProvider: ''
                  stateModel: ''
                  stateMaxTokensCeiling: 8192
                  standingSourceKinds:
                    - agent-instructions
                  #
                  # 1.2.0 behaviour (fold after actionsPerCompaction actions), if
                  # wanted: foldTrigger actions, foldMarginTokens 0,
                  # foldMinGainTokens 0, recapMaxRatio 0, mechanicalFoldMaxTokens
                  # 0, replyReasoningFoldChars 0, stateMaxTokensThinking 0,
                  # digestResultChars 600, digestShrinkToBudget false.
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
                config:
                  interrupt: false
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelection: true
                  modelDiscovery: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-office
            name: '@deepseek-ai/dsh-tool-office'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: !!js "!ctx.get('profileContext')"
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true
