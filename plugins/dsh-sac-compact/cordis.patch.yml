# Inserted by the @local/dsh-sac-compact bundle.
#
# Optimized defaults (2026-11-17, GLM-5.3-Inner @ 128K): paper-mode summarizer,
# batch two actions per fold, keep the newest observation raw, trim only huge
# observations, cap the recap at 400 words, drop the conversation prefix from
# the state-update request, and force a fold when the surface approaches 96K
# tokens (hard safety net under a 128K window).
#
# `statePrompt: inline` (v9) is still available, but reasoning models such as
# GLM-5.3-Inner emit no text block before tool calls, so the plugin falls back
# to paper after `inlineFallbackAfter` misses.
#
# Since 1.2.0 every user instruction stays on the surface verbatim and only the
# work between instructions is folded; the four `*Instruction*` keys below are
# the defaults, listed so the multi-turn behaviour is visible in the profile.
#
# Since 1.3.0 the bundle ships the cost-aware policy measured in
# reports/REPORT-SAC-PARETO.md: identical to full history on short dialogues
# (nothing folds), about 90% fewer tokens on long sessions.
- insert:
    - id: sac-compact
      name: '@local/dsh-sac-compact'
      inject:
        - systemPrompt
        - tools
        - llm
      config:
        enabled: true
        actionsPerCompaction: 2
        minSpanChars: 1200
        minSpanTokens: 400
        charsPerToken: 3.5
        statePrompt: paper
        stateMaxTokens: 2048
        stateInputMaxChars: 0
        stateBudget: 2048
        adaptiveBudget: true
        keepLastObservation: true
        trimObservationOver: 4000
        stateMaxWords: 400
        stateInputLean: true
        contextBudgetTokens: 96000
        inlineFallbackAfter: 2
        ledger: false
        ledgerChars: 2400
        ledgerFullCommands: true
        recall: false
        checklist: false
        # Multi-turn (1.2.0): pin every user instruction, keep the 4 most
        # recent ones verbatim, quote older ones in the archive state.
        pinInstructions: true
        instructionSourceKinds:
          - user
          - goal
        maxPinnedInstructions: 4
        instructionChars: 4000
        # Cost-aware folding (1.3.0), the shipped policy. Folding pays for
        # itself only on long sessions: on a ten-step dialogue a fold costs
        # more than the context it frees, and folding often makes the agent
        # re-read what was folded (reports/REPORT-SAC-PARETO.md). Hence:
        foldTrigger: size
        # …fold by the size of the whole request, not by action count,
        foldMarginTokens: 32000
        # …once it exceeds the fixed prompt (system prompt + tool schemas) by
        # about 32K tokens, and down to the fixed prompt + about 16K
        # (foldBelowTokens 0 = half the margin). One setting then fits a 5K
        # customer-service prompt and a 20K coding-agent prompt. Lower it to
        # 24000 or 12000 to trade more folds for a smaller context.
        foldAboveTokens: 0
        foldBelowTokens: 0
        maxFoldsPerStep: 3
        foldMinGainTokens: 400
        # …a model recap only replaces a span at least the recap + 400 tokens …
        recapExpectedTokens: 0
        recapMaxRatio: 0.6
        # …and stays under 60% of that span (never refused as "not smaller").
        mechanicalFoldMaxTokens: 4000
        mechanicalSegments: frozen
        mechanicalMinGainTokens: 80
        # Small digests are written by the harness (no model call), for
        # finished turns only: digesting the working state after every step
        # made the agent redo its work.
        digestResultChars: 2000
        digestReplyChars: 4000
        digestMaxChars: 3000
        digestShrinkToBudget: true
        # JSON results are compacted by structure, not cut. When a finished turn
        # holds more results than fit that budget, every result takes a smaller
        # share (its head) instead of the turn being handed to the model.
        replyReasoningFoldChars: 1500
        # A final reply with heavy reasoning folds with its turn.
        stateMaxTokensThinking: 4096
        # A thinking agent's first recap starts from a 4,096 output cap.
        goalDedupe: true
        # Optional, not set here: stateProvider / stateModel, a non-reasoning
        # model that writes the recaps (about 5 s instead of 20-70 s per fold).
        stateProvider: ''
        stateModel: ''
        stateMaxTokensCeiling: 8192
        standingSourceKinds:
          - agent-instructions
        #
        # 1.2.0 behaviour, if wanted: foldTrigger actions, foldMarginTokens 0,
        # foldMinGainTokens 0, recapMaxRatio 0, mechanicalFoldMaxTokens 0,
        # replyReasoningFoldChars 0, stateMaxTokensThinking 0, digestResultChars 600.
